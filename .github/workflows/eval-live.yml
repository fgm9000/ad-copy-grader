name: Live Promptfoo Evals

on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenRouter model name for evaluation"
        required: false
        default: "google/gemini-2.5-flash"
        type: string
      suite:
        description: "main = 16 tuning cases; holdout = v1 (seen during the veto diagnosis); holdout_v2 = seen during the evidence diagnosis; holdout_v3 = frozen before the A02 extraction redesign"
        required: false
        default: "main"
        type: choice
        options:
          - main
          - holdout
          - holdout_v2
          - holdout_v3

jobs:
  eval-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen
      - name: Run Live Promptfoo Evaluation
        run: uv run npx --yes promptfoo@0.109.0 eval -c "evals/${EVAL_CONFIG}" --no-cache --no-write -o promptfoo-live-results.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ inputs.model || 'google/gemini-2.5-flash' }}
          EVAL_CONFIG: ${{ inputs.suite == 'holdout' && 'promptfooconfig.holdout.yaml' || inputs.suite == 'holdout_v2' && 'promptfooconfig.holdout2.yaml' || inputs.suite == 'holdout_v3' && 'promptfooconfig.holdout3.yaml' || 'promptfooconfig.yaml' }}
      - name: Upload Evaluation Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-live-results
          path: promptfoo-live-results.json
