name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest --cov=ad_copy_grader --cov-report=term-missing

  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python scripts/quality_check.py

  eval-fake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen
      - run: uv run npx --yes promptfoo@0.109.0 eval -c evals/promptfooconfig.yaml --no-cache --no-write
        env:
          FAKE_MODEL: "1"

  sast-owasp:
    name: SAST (Semgrep OWASP Top 10 & FastAPI)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep OWASP Top 10 + Python + FastAPI rulesets
        run: semgrep scan --config p/owasp-top-ten --config p/python --config p/fastapi --error --metrics=off src/ scripts/ evals/

  secrets:
    runs-on: ubuntu-latest
    container:
      image: zricethezav/gitleaks:v8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks full-history scan
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks detect --source . --verbose --redact

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pip-audit
